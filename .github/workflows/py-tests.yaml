name: Py Tests

# Python tests on every supported Python, the TypeScript package's tests, and
# the ACP Test Compatibility Kit against the proxy in front of the fake agent
# (SHIELD SH-02, SH-08). No secrets: every test is self-contained.

on:
  push:
    branches:
      - main
    paths:
      - 'agent_shield/**'
      - 'tests/**'
      - 'schema/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'pyproject.toml'
      - '.github/workflows/py-tests.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'agent_shield/**'
      - 'tests/**'
      - 'schema/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'pyproject.toml'
      - '.github/workflows/py-tests.yaml'

  workflow_dispatch:

  # Called by the Release workflow: a tag publishes nothing until these pass.
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install
        run: uv pip install .[test]

      - name: Run tests
        run: pytest tests/ -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test (the types against schema/policy.schema.json)
        run: |
          npm install --no-audit --no-fund
          npm test

  tck:
    # The ACP Test Compatibility Kit (github.com/agentclientprotocol/acp-tck,
    # experimental, Python 3.14) drives an *agent* over stdio: here the proxy
    # in front of the fake agent, and the fake agent alone as the baseline.
    # It tests agents only; the proxy's client face has no kit.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: '3.13'
          activate-environment: true

      - name: Install the Shield
        run: uv pip install .[test]

      - name: Install the TCK
        run: uv tool install --python 3.14 "git+https://github.com/agentclientprotocol/acp-tck@fa00ccdc13df"

      # The TCK runs the agent with cwd /tmp/wd (--agent-cwd), so paths are
      # absolute, and the venv's python, where the SDK is installed.
      - name: The fake agent alone (the baseline)
        run: |
          mkdir -p /tmp/wd
          acp-tck --agent-cwd /tmp/wd --timeout 20 --test-timeout 60 --report-json baseline.json -- "$VIRTUAL_ENV/bin/python" "$GITHUB_WORKSPACE/tests/fixtures/fake_agent.py"

      - name: The proxy in front of the fake agent
        run: |
          "$VIRTUAL_ENV/bin/agent-shield" policy init /tmp/wd/agent-shield.yaml
          acp-tck --agent-cwd /tmp/wd --timeout 20 --test-timeout 60 --report-json proxy.json -- "$VIRTUAL_ENV/bin/agent-shield" run --policy /tmp/wd/agent-shield.yaml -- "$VIRTUAL_ENV/bin/python" "$GITHUB_WORKSPACE/tests/fixtures/fake_agent.py"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tck-reports
          path: |
            baseline.json
            proxy.json
