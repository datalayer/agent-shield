[build-system]
requires = ["hatchling~=1.21"]
build-backend = "hatchling.build"

[project]
name = "datalayer-agent-shield"
description = "Datalayer Agent Shield: a runtime firewall for every agent"
authors = [{ name = "Datalayer", email = "info@datalayer.io" }]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["AI", "Agents", "Shield", "Firewall", "ACP", "Policy", "Datalayer"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    # The official Agent Client Protocol SDK, protocol version 1. The proxy,
    # the channels and the normaliser are written against 0.7.x's surface
    # (`acp.connection.Connection`, the client and agent routers, the
    # schema's camelCase aliases); a newer minor is taken on after it is run.
    "agent-client-protocol>=0.7.1,<0.8",
]

[project.scripts]
agent-shield = "agent_shield.cli:main"

# The Datalayer CLI discovers its extensions through this group: installing
# agent-shield beside it is what makes `datalayer agent-shield` exist there.
[project.entry-points."datalayer.cli"]
agent-shield = "agent_shield.reactor_extension:plugin"

# And through the reactor's own CLI group: `reactor agent-shield` wherever both
# are installed, with the same plugin doing the extending.
[project.entry-points."datalayer.reactor.cli"]
agent-shield = "agent_shield.reactor_extension:plugin"

[project.optional-dependencies]
# The WebSocket channel: an agent served at a URL (agent-runtimes' ACP route,
# `agent-shield serve`), and `agent-shield connect`.
websocket = ["websockets>=13"]
# `agent-shield serve`: the proxy as a server over WebSocket and ACP Streamable
# HTTP (SH-52, SH-56); the sidecar bridge (SH-40).
serve = ["aiohttp>=3.9"]
# A registered Shield exports its telemetry to Datalayer's observability (SH-47, SH-51).
otel = ["opentelemetry-sdk>=1.26", "opentelemetry-exporter-otlp-proto-http>=1.26"]
# The harness catalogue and the register (SHIELD SH-01, SH-04): the Shield
# reads them from agentspecs and keeps no copy. An extra, not a dependency:
# the policy engine and the SaaS client (`agent_shield.policy`, `agent_shield.saas`)
# are what IAM installs to validate a Shield policy, and they must not drag
# the catalogue's sandbox stack behind them (SH-50).
register = ["agentspecs>=0.0.107"]
# The company role of PAP (SH-71): the Shield in front of any agent, on the PAP SDK's company service.
pap = ["personal-agent-protocol>=0.24"]
# One extra per harness. The adapters are Node packages, which
# pip cannot install: `agent-shield setup --harness <id>` installs the pinned
# one into the Shield's own prefix. The extras name the choice on the install
# line and bring the register the setup reads.
claude-code = ["datalayer-agent-shield[register]"]
codex = ["datalayer-agent-shield[register]"]
gemini-cli = ["datalayer-agent-shield[register]"]
goose = ["datalayer-agent-shield[register]"]
opencode = ["datalayer-agent-shield[register]"]
openhands = ["datalayer-agent-shield[register]"]
all = ["datalayer-agent-shield[websocket,serve,otel,register,pap]"]
test = [
  "agentspecs>=0.0.107",
  "personal-agent-protocol>=0.24",
  # tests/test_cli.py reads pyproject.toml; tomllib is 3.11+.
  "tomli>=2; python_version < '3.11'",
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "pytest-timeout>=2.0",
  "websockets>=13",
  "aiohttp>=3.9",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp-proto-http>=1.26",
]
lint = ["mdformat>0.7", "mdformat-gfm>=0.3.5", "ruff"]
typing = ["mypy>=0.990"]

[project.license]
file = "LICENSE"

[project.urls]
Home = "https://github.com/datalayer/agent-shield"
Documentation = "https://agent-shield.datalayer.tech"

# The distribution is `datalayer-agent-shield` (PyPI refused `agent-shield` as
# too close to an existing name); the import stays `agent_shield`, so the
# package is named here rather than derived from the project name.
[tool.hatch.build.targets.wheel]
packages = ["agent_shield"]

[tool.hatch.build.targets.sdist]
include = ["agent_shield", "schema", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.version]
path = "agent_shield/__version__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
filterwarnings = [
  "error",
  "ignore:There is no current event loop:DeprecationWarning",
]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
pretty = true
show_error_context = true
show_error_codes = true
strict_equality = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "FBT", "I", "N", "Q", "RUF", "S", "T", "UP", "W", "YTT"]
# N818: the refusals are named for what they say (PolicyRefused, OutsideWorkspace), not suffixed.
ignore = ["FBT001", "FBT002", "FBT003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "C408", "E501", "RUF043", "N801"]
# Typer declares an option as a call in a default (B008); `Optional[X]` is
# what Typer reads at run time (UP045).
# S603/S607: `npm install --prefix` and `node --version` are the commands the Shield runs by design;
# C901/E501: the setup command is one long walk, and its sentences are not wrapped.
"agent_shield/cli.py" = ["B008", "UP045", "S603", "S607", "C901", "E501"]
"tests/fixtures/*" = ["T201", "C901", "S101"]
# The proxy's sentences are not wrapped; the normaliser and the update handler are dispatchers (C901).
"agent_shield/acp/proxy.py" = ["E501", "C901"]
"agent_shield/acp/normalize.py" = ["C901"]
# The server's handlers are dispatchers over headers and methods (C901); its sentences are not wrapped.
"agent_shield/acp/server.py" = ["C901", "E501"]
# The documentation's scripts speak on stdout, walk syntax trees and run the generator.
"docs/scripts/*" = ["T201", "C901", "E501", "S603", "B007"]
